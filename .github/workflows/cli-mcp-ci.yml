name: cli-mcp-ci

# Lightweight CI for the headless CLI + stdio MCP entry points.
#
# Why a separate workflow instead of extending build.yml: the upstream release
# pipeline (build.yml) only triggers on v* tags and builds the native fastboot
# payload, the AppImage (glibc 2.31 container) and the pacman package. None of
# that runs on a branch push, so it cannot gate the CLI/MCP change set. This
# workflow is deliberately narrow: restore, build the two C# projects, run
# hardware-free smoke tests, upload the CLI build output. Firmware/loaders and
# the bundled fastboot payload are excluded from the artifact on purpose
# (business-source-licensed assets, not build products).
#
# The main csproj runs "make -C native/usb-update" through its
# BuildUsbUpdateBridge target on Linux, so the CI needs cc + pkg-config +
# libusb-1.0 headers. That is the only native step required here; the whole
# native/fastboot-modern build stays in build.yml.

on:
  push:
    branches:
      - main
      - feat/cli-and-mcp-entry
  pull_request:
    branches:
      - main
      - feat/cli-and-mcp-entry
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: build CLI + MCP entry (net10.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK info
        run: dotnet --info

      # Required by the BuildUsbUpdateBridge target in Kirin-Tool.csproj.
      - name: Install native build dependencies (libusb headers only)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libusb-1.0-0-dev

      - name: Restore
        run: |
          dotnet restore Kirin-Tool.csproj
          dotnet restore KirinTool.Cli/KirinTool.Cli.csproj

      - name: Build main app (Release)
        run: dotnet build Kirin-Tool.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Build CLI project (Release)
        run: dotnet build KirinTool.Cli/KirinTool.Cli.csproj -c Release --no-restore -p:NuGetAudit=false

      # Hardware-free tests, run after the two builds so they exercise the exact
      # assemblies under test. tests/FlashPolicy pins the shared write policy
      # (Utils/FlashPolicy.cs: skip list + redline set) and re-checks the CLI side
      # by driving "KirinTool.Cli flash-ota" against a synthetic UPDATE.APP that
      # stops at the plan gate. tests/StableParity keeps the frozen release
      # boundary intact.
      - name: Test - flash policy (shared redline/skip policy + CLI plan gate)
        run: dotnet run --project tests/FlashPolicy -c Release -p:NuGetAudit=false

      - name: Test - stable parity (frozen boundary)
        run: dotnet run --project tests/StableParity -c Release -p:NuGetAudit=false

      # The rest of the hardware-free harnesses. They were only run by hand before,
      # so a regression in parsing/serial/sparse/flash-detail handling could ship.
      # Hardware probes (tests/VcomOpenProbe, tests/UsbUpdateProbe) and the pixel
      # comparison (tests/VisualParity, font-dependent) stay out on purpose.
      - name: Test - hardware-free suites
        run: |
          set -euo pipefail
          for t in FastbootReads VcomPromptUi GuiQol Extractor UsbDiagnostics \
                   UsbTransport UsbUpdateUi OemInfoUi UdevNotice Kirin9000; do
            echo "::group::$t"
            dotnet run --project "tests/$t" -c Release -p:NuGetAudit=false
            echo "::endgroup::"
          done

      # The runner has no phone in fastboot mode. BinaryLocator also probes PATH
      # and /usr/bin, so a tiny stub is enough to exercise "doctor" end to end
      # without installing platform-tools or touching USB.
      - name: Smoke test - help, version, doctor (stubbed fastboot)
        run: |
          set -euo pipefail
          cli=KirinTool.Cli/bin/Release/net10.0/KirinTool.Cli
          test -x "$cli"

          "$cli" --help | tee /tmp/help.txt
          grep -q 'usage: kirintool' /tmp/help.txt
          grep -q 'mcp' /tmp/help.txt

          "$cli" version

          stub="$RUNNER_TEMP/stub-bin"
          mkdir -p "$stub"
          # Written with echo (not a heredoc): a YAML block scalar cannot hold
          # column-0 lines, and a shebang needs to start at column 0.
          {
            echo '#!/usr/bin/env bash'
            echo 'if [ "${1:-}" = "--version" ]; then echo "fastboot version 35.0.2-ci-stub"; exit 0; fi'
            echo 'if [ "${1:-}" = "devices" ]; then exit 0; fi'
            echo 'echo "FAILED (remote: no device in CI stub)"; exit 1'
          } > "$stub/fastboot"
          chmod +x "$stub/fastboot"

          KIRIN_FASTBOOT="$stub/fastboot" "$cli" doctor --json | tee /tmp/doctor.json
          grep -q '"fastboot-found"' /tmp/doctor.json
          grep -q '"loaders-bundled"' /tmp/doctor.json
          "$stub/fastboot" --version

      - name: Smoke test - stdio MCP session
        run: |
          set -euo pipefail
          cli=KirinTool.Cli/bin/Release/net10.0/KirinTool.Cli
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$cli" mcp 2>/tmp/mcp.err | tee /tmp/mcp.out
          grep -q '"result"' /tmp/mcp.out
          grep -q '"tools"' /tmp/mcp.out
          grep -q '"flash_ota"' /tmp/mcp.out

      # Build products only: skip the bundled loaders (**/*.ktl firmware) and the
      # fastboot/payload blob, they are licensed assets copied from the repo,
      # not something CI produced. The Skia/Avalonia native runtimes for
      # win-*/osx/arm/musl are pull-through from Avalonia's package and account
      # for ~120 MB; only runtimes/linux-x64 is kept so the artifact stays usable
      # on x64 Linux without uploading other platforms' binaries.
      - name: Stage artifact (CLI output, no firmware)
        run: |
          set -euo pipefail
          src=KirinTool.Cli/bin/Release/net10.0
          dst=artifact/KirinTool.Cli
          mkdir -p "$dst"
          rsync -a \
            --exclude 'runtimes/' \
            --exclude 'loaders/' \
            --exclude 'fastboot/' \
            --exclude 'fastboot-modern/' \
            --exclude '*.pdb' \
            --exclude '*.dbg' \
            "$src/" "$dst/"
          # Re-add only the x64 Linux native runtimes (SkiaSharp/HarfBuzzSharp).
          mkdir -p "$dst/runtimes"
          rsync -a "$src/runtimes/linux-x64" "$dst/runtimes/"
          # Belt and braces: never ship a large blob by accident.
          find artifact -type f -size +25M -print -delete
          du -sh artifact/KirinTool.Cli
          ls artifact/KirinTool.Cli | head -40

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirin-tool-cli-${{ github.sha }}
          path: artifact/KirinTool.Cli
          if-no-files-found: error
          retention-days: 14

  # The deb writer is distribution-sensitive: Depends names (libicu<soname>,
  # libssl3 vs libssl3t64) differ per release, and a wrong name makes the package
  # uninstallable on the user's machine while still building fine. Hence a matrix:
  # ubuntu-latest (currently 24.04) plus an explicitly pinned 24.04 runner, each
  # of which also *resolves* the Depends against that release's archive.
  packaging-smoke:
    name: deb packaging smoke (synthetic publish tree, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04
          # GA since 2026-09: the release the user's host runs. libicu78 lives here.
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # Builds the real .deb writer against a fake publish tree: catches path/metadata
      # regressions in packaging/build-deb.sh without spending 20 min on a native build.
      - name: Build deb from a synthetic publish tree
        run: |
          set -euo pipefail
          P=publish-fake
          mkdir -p "$P/fastboot" "$P/loaders/hisi990" "$P/licenses" "$P/docs"
          printf '#!/bin/sh\necho fake-gui\n' > "$P/Kirin-Tool"
          printf '#!/bin/sh\necho "fastboot version 35.0.2-kirin-tool-linux-huawei-parity"\n' > "$P/fastboot/fastboot"
          head -c 64 /dev/zero > "$P/loaders/hisi990/fastboot.ktl"
          echo marker > "$P/libkirin_usb_update.so"
          echo license > "$P/licenses/LICENSE"
          echo doc > "$P/docs/README.md"
          printf '#!/bin/sh\necho fake-probe\n' > "$P/UsbUpdateProbe"
          printf '#!/bin/sh\necho fake-probe\n' > "$P/VcomOpenProbe"
          printf '#!/bin/sh\necho fake-cli\n' > cli-fake
          chmod +x "$P/Kirin-Tool" "$P/fastboot/fastboot" "$P/UsbUpdateProbe" "$P/VcomOpenProbe" cli-fake

          ./packaging/build-deb.sh "$P" 0.0.0-ci ./cli-fake dist

          DEB="$(ls dist/*.deb)"
          echo "built: $DEB"
          dpkg-deb -I "$DEB" | tee /tmp/control.txt
          grep -q 'Package: kirin-tool-linux' /tmp/control.txt
          grep -q 'Architecture: amd64' /tmp/control.txt
          dpkg-deb -c "$DEB" > /tmp/contents.txt
          for f in usr/lib/kirin-tool-linux/Kirin-Tool usr/bin/kirin-tool usr/bin/kirin-tool-cli \
                   usr/lib/udev/rules.d/51-kirin-tool-fastboot.rules usr/share/applications/kirin-tool.desktop; do
            grep -qF "$f" /tmp/contents.txt
          done
          echo 'deb packaging smoke OK'

      # Guard against Depends drift: resolve the generated control file against
      # *this* runner's archive. apt-get -s does a full dependency simulation
      # without installing anything (no root needed), so an unsatisfiable
      # "libicu<soname>" or "libssl3" is reported here instead of on a user's
      # machine. Real-world failure this catches:
      #   kirin-tool-linux : 依赖: libicu76 但无法安装它 或 libicu74 ... libicu66
      - name: Assert Depends are satisfiable on this runner
        run: |
          set -euo pipefail
          DEB="$(ls "$PWD"/dist/*.deb)"
          # Runners normally ship a populated apt index; refresh it anyway so the
          # simulation resolves against the same archive a user would see.
          sudo apt-get update -qq
          . /etc/os-release
          echo "simulating install of $DEB on ${PRETTY_NAME}"
          out=/tmp/apt-simulate.txt
          set +e
          apt-get -s --no-install-recommends install "$DEB" >"$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::apt-get -s failed (rc=$rc) for $DEB on ${PRETTY_NAME}"
            exit 1
          fi
          if grep -qiE 'unmet dependencies|not installable|Unable to satisfy|无法安装' "$out"; then
            echo "::error::unsatisfiable Depends in $DEB on ${PRETTY_NAME}"
            grep -iE 'libicu|libssl|not installable|无法安装|Unable to satisfy|依赖' "$out" || true
            exit 1
          fi
          echo 'dependency simulation OK'
